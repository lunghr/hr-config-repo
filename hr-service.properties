# Server Configuration
server.port=8543
server.http.port=8180
server.servlet.context-path=/hr-service/api
server.ssl.enabled=true

# Server keystore
server.ssl.key-store=classpath:spring-server.jks
server.ssl.key-store-password=changeit
server.ssl.key-store-type=JKS
server.ssl.key-alias=spring-server

# Server protocols
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2

# Health check endpoint
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.non-secure-port=${server.http.port}
eureka.instance.secure-port=${server.port}
eureka.instance.secure-port-enabled=true
eureka.instance.home-page-url=https://localhost:${server.port}${server.servlet.context-path}
eureka.instance.status-page-url=https://localhost:${server.port}${server.servlet.context-path}/actuator/info
eureka.instance.health-check-url=https://localhost:${server.port}${server.servlet.context-path}/actuator/health

